{% extends "base.html" %}
{% block title %}Вхід — Hop & Barley{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <h3 class="mb-4">Вхід</h3>
        <form method="post" novalidate>
            {% csrf_token %}
            {{ form.non_field_errors }}
            <div class="mb-3">
                <label class="form-label">Логін</label>
                {{ form.username }}
                {{ form.username.errors }}
            </div>
            <div class="mb-3">
                <label class="form-label">Пароль</label>
                {{ form.password }}
                {{ form.password.errors }}
            </div>
            <button type="submit" class="btn btn-warning w-100">Увійти</button>
        </form>
        <p class="mt-3 text-muted">Ще немає акаунта? <a href="{% url 'users:register' %}">Зареєструватися</a></p>
    </div>
</div>
{% endblock %}
